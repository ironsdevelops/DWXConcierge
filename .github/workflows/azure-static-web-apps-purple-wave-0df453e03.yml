name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Create runtime config
        # config.js is gitignored (see .gitignore) so the checkout above never has it — it's
        # generated here, at build time, from repository secrets, and only ever exists on the
        # Actions runner's disk and in the deployed output. It's never written to git history.
        run: |
          cat > config.js << EOF
          window.LISA_CONFIG = {
            TOKEN_ENDPOINT: "${TOKEN_ENDPOINT}",
            SPEECH_KEY: "${SPEECH_KEY}",
            SPEECH_REGION: "${SPEECH_REGION}"
          };
          EOF
        env:
          TOKEN_ENDPOINT: ${{ secrets.LISA_TOKEN_ENDPOINT }}
          SPEECH_KEY: ${{ secrets.LISA_SPEECH_KEY }}
          SPEECH_REGION: ${{ secrets.LISA_SPEECH_REGION }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WAVE_0DF453E03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WAVE_0DF453E03 }}
          action: "close"
